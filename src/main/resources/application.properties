spring.application.name=entity-dto

server.port=8099

# =====================================================
# Thymeleaf
# =====================================================
spring.thymeleaf.cache=false

# =====================================================
# Request/response encoding (UTF-8 cho tieng Viet, ke ca multipart form-data)
# =====================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =====================================================
# Database - MySQL (database rieng cho bai tap nay, khong dung chung
# voi webst2 vi webst2 da co du lieu that cua project khac)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/entitydto_demo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate ddl auto (create, create-drop, update, none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# =====================================================
# FILE UPLOAD
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# GraphQL
# Endpoint: POST /graphql
# GraphiQL (UI test truy van): http://localhost:8099/graphiql
# =====================================================
spring.graphql.graphiql.enabled=true

